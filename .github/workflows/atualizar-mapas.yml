name: Atualizar mapas do Recife Calor

on:
  workflow_dispatch:
  schedule:
    - cron: '27 9 * 9-12 1'

permissions:
  contents: read

concurrency:
  group: recife-calor-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-processing.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-processing.txt
      - name: Processar e conferir os mapas
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          config_path = Path("config.json")
          config = json.loads(config_path.read_text())
          today = date.today()
          config.update(as_of=today.isoformat(), end_year=today.year)
          config_path.write_text(json.dumps(config))
          PY
          python main.py
          python -m pytest tests -q
          node --check web/research.js
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config.json").read_text())
          manifest = json.loads(Path("outputs/manifest.json").read_text())
          # Preserve all previously published years if new scenes are temporarily unavailable.
          if not set(range(config["start_year"], config["end_year"] + 1)).issubset(
              {entry["year"] for entry in manifest["years"]}
          ):
              raise SystemExit("Atualização incompleta. A publicação anterior continua disponível.")
          PY
          python preparar_publicacao.py "$RUNNER_TEMP/recife-calor"
      - name: Publicar na Vercel
        working-directory: ${{ runner.temp }}/recife-calor
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" ||
            { echo "::error::Configure o token e os IDs do projeto Vercel no GitHub."; exit 1; }
          export XDG_DATA_HOME="$RUNNER_TEMP/vercel-cli-data"
          mkdir -p "$XDG_DATA_HOME/com.vercel.cli"
          python -c 'import json, os; from pathlib import Path; p = Path(os.environ["XDG_DATA_HOME"]) / "com.vercel.cli/auth.json"; p.write_text(json.dumps({"token": os.environ["VERCEL_TOKEN"]})); p.chmod(0o600)'
          cli=(npx --yes vercel@65.15.0)
          previous=$(python -c 'import os, requests; r=requests.get("https://api.vercel.com/v9/projects/"+os.environ["VERCEL_PROJECT_ID"],params={"teamId":os.environ["VERCEL_ORG_ID"]},headers={"Authorization":"Bearer "+os.environ["VERCEL_TOKEN"]},timeout=30); r.raise_for_status(); print(r.json().get("targets",{}).get("production",{}).get("id",""))')
          test -n "$previous" || { echo "::error::A versão anterior não pôde ser identificada."; exit 1; }
          deployment=$("${cli[@]}" deploy --prod --skip-domain --yes)
          "${cli[@]}" promote "$deployment" --yes
          if ! python - <<'PY'
          import json, time
          from pathlib import Path
          import requests
          expected = json.loads(Path("outputs/manifest.json").read_text())
          last_error = None
          for attempt in range(8):
              try:
                  base = "https://recife-calor.vercel.app"
                  for route in ["/", "/static/app.js", "/static/research.js",
                                "/maps/2019_temperature.png",
                                "/api/pixel?year=2019&lat=-8.05&lon=-34.94"]:
                      response = requests.get(base + route, timeout=45)
                      response.raise_for_status()
                  response = requests.get(base + "/api/manifest", timeout=45)
                  response.raise_for_status()
                  assert response.json() == expected, "Manifesto público diverge do processado"
                  for route in ["/api/research-grid"] + [
                      f"/api/research/{entry['year']}" for entry in expected["years"]
                  ]:
                      response = requests.get(base + route, timeout=45)
                      response.raise_for_status()
                      assert response.json()["generated_at"] == expected["generated_at"]
                  break
              except (requests.RequestException, ValueError, AssertionError) as error:
                  last_error = error
                  time.sleep(5)
          else:
              raise SystemExit(f"Falha ao conferir a versão pública: {last_error}")
          PY
          then
            "${cli[@]}" promote "$previous" --yes
            exit 1
          fi
