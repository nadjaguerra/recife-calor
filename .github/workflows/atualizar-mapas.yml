name: Atualizar mapas do Recife Calor

on:
  workflow_dispatch:
  schedule:
    - cron: '27 9 * 9-12 1'

permissions:
  contents: read

concurrency:
  group: recife-calor-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-processing.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-processing.txt
      - name: Processar e conferir os mapas
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          config_path = Path("config.json")
          config = json.loads(config_path.read_text())
          today = date.today()
          config.update(as_of=today.isoformat(), end_year=today.year)
          config_path.write_text(json.dumps(config))
          PY
          python main.py
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config.json").read_text())
          manifest = json.loads(Path("outputs/manifest.json").read_text())
          # Preserve all previously published years if new scenes are temporarily unavailable.
          if not set(range(config["start_year"], config["end_year"] + 1)).issubset(
              {entry["year"] for entry in manifest["years"]}
          ):
              raise SystemExit("Atualização incompleta. A publicação anterior continua disponível.")
          PY
          python preparar_publicacao.py "$RUNNER_TEMP/recife-calor"
      - name: Publicar na Vercel
        working-directory: ${{ runner.temp }}/recife-calor
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" ||
            { echo "::error::Configure o token e os IDs do projeto Vercel no GitHub."; exit 1; }
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
